# Publishes the package to the private registry at npm.tokensapi.ai.
#
# Pushing a `v*` tag is the only release path: there is no manual trigger, so a
# version can never be published twice in parallel. To retry a failed release,
# re-run this workflow from the Actions tab.
#
# The check job here is deliberate, not a duplicate of checks.yml. `needs:`
# cannot span workflows, so a release gates on checks it runs itself. checks.yml
# ignores tags, so nothing runs twice.
name: Publish to private npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release must never be cancelled halfway through publishing.
  cancel-in-progress: false

env:
  NPM_REGISTRY: https://npm.tokensapi.ai/

jobs:
  check:
    name: Test and build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Mirrors the engines range in package.json.
        node: [22.19.0, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run checks
        run: pnpm run check

  publish:
    name: Publish to private npm
    # Every supported Node version must pass before a tag can ship.
    needs: check
    # The tag trigger already guarantees this; kept so a stray trigger cannot
    # reach the publish step.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
      package-check: ${{ steps.checker.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.tokensapi.ai/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/validate-release.mjs "$RELEASE_TAG"

      - name: Refuse fork publishing
        run: |
          if [ "$GITHUB_REPOSITORY" != 'TokensAPI/tokens_DshProgressiveTools_code' ]; then
            echo 'Release publishing is enabled only for the canonical repository; this fork run remains check-only.' >&2
            exit 1
          fi

      - name: Build package
        run: pnpm run build

      - name: Pack verified release
        run: |
          mkdir -p .release
          # The prepack script re-runs the full check suite, which the check job
          # already did on both Node versions. Pack has no --ignore-scripts
          # option of its own, so the setting goes through --config.
          pnpm pack --pack-destination .release --config.ignore-scripts=true

      # 发布包检查是附加门禁：未配置只读 Secret 时跳过检查但不阻断发布；
      # 一旦配置，账号必须是 market，配错仍在发布前失败。
      - name: 检查 · 发布包检查的只读凭证
        id: checker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::warning::未配置只读 Secret PLUGIN_CHECK_REGISTRY_TOKEN，本次跳过发布包检查'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$(npm whoami --registry=https://npm.tokensapi.ai/)" == market ]] || { echo '::error::包检查需要 market 只读账号'; exit 1; }
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Publish to private npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_PUBLISH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Configure the VERDACCIO_PUBLISH_TOKEN repository secret before releasing.' >&2
            exit 1
          fi
          publisher="$(npm whoami --registry="$NPM_REGISTRY")"
          if [ "$publisher" != 'tokenscowork' ]; then
            echo 'The registry token does not belong to the approved publisher tokenscowork.' >&2
            exit 1
          fi
          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          # An unreachable or unauthorized registry must abort instead of reading
          # as "this version is not published yet".
          set +e
          view_output="$(npm view "$package_name@$package_version" version --registry="$NPM_REGISTRY" 2>&1)"
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ]; then
            echo "Refusing to overwrite already published $package_name@$package_version." >&2
            exit 1
          fi
          case "$view_output" in
            *E404*|*'404 Not Found'*)
              ;;
            *)
              echo "Cannot confirm that $package_name@$package_version is unpublished; refusing to publish." >&2
              echo "$view_output" >&2
              exit 1
              ;;
          esac
          npm publish .release/*.tgz --ignore-scripts --registry="$NPM_REGISTRY" --tag=latest
          npm view "$package_name@$package_version" version --registry="$NPM_REGISTRY"
      - name: 报告 · 输出已发布的准确版本
        id: package
        run: node -p '"package=" + require("./package.json").name + "@" + require("./package.json").version' >> "$GITHUB_OUTPUT"

  package-check:
    name: 检查 · 插件发布包
    needs: publish
    if: needs.publish.outputs.package-check == 'true'
    uses: TokensAPI/tokens_DshPluginCheck_code/.github/workflows/check-plugin-package.yml@e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    with:
      package: ${{ needs.publish.outputs.package }}
      checker_ref: e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    secrets:
      PLUGIN_CHECK_REGISTRY_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
